[project]
name = "twicerun"
version = "0.1.0"
description = "Runs a batch pipeline several times on the same input and reports, per step, how often it failed to give the same answer"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly. Parallel reduction order is an implementation detail that
    # changes between DuckDB releases, and every number this project reports is
    # a number about that detail, so a range would make the results unquotable.
    "duckdb==1.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    # Enforces constraint 4 rather than trusting it: --disable-socket makes any
    # accidental network call a test failure.
    "pytest-socket>=0.7.0",
    "ruff>=0.6.0",
]

[project.scripts]
twicerun = "twicerun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twicerun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE is here so the four deliberate blanket catches have to keep saying so.
# The noqa comments on them predated it and were inert, which meant a fourth
# could arrive without anyone noticing. One did, and the two comments that
# describe the set still said three afterwards, because ruff can require a noqa
# on each of them and cannot count them. tests/test_blanket_catches.py counts.
select = ["E", "F", "I", "UP", "B", "BLE", "SIM"]
